version: "3"

tasks:
  default:
    desc: Set up mac-neo dependencies
    preconditions:
      - sh: '[ "$(uname -s)" = Darwin ]'
        msg: install/mac-neo only runs on macOS
      - sh: command -v pnpm
        msg: pnpm is required to install global packages
    cmds:
      - task: go-install
      - task: go-task-install
      - task: fish-install
      - task: fzf-install
      - task: starship-install
      - task: delta-install
      - task: difftastic-install
      - task: lazygit-install
      - task: worktrunk-install
      - task: ripgrep-install
      - task: btop-install
      - task: ctop-install
      - task: iperf3-install
      - task: 1password-cli-install
      - task: tmux-install
      - task: stow-install
      - task: httping-install
      - task: kubectl-install
      - task: httpstat-install
      - task: tree-install
      - task: fd-install
      - task: cargo-install
      - task: lumen-install
      - task: neovim-install
      - task: pi-agent-install
      - task: opencode-install
      - task: codex-install
      - task: manual-setup-notes

  manual-setup-notes:
    internal: true
    desc: Print manual setup notes
    silent: true
    cmds:
      - |
        echo 'Manual setup required:'
        echo 'After fish shell is set up, open fish and run: wt config shell install'

  go-install:
    internal: true
    desc: Install Go
    cmds:
      - brew install --no-ask go

  go-task-install:
    internal: true
    desc: Install go-task
    cmds:
      - brew install --no-ask go-task

  fish-install:
    internal: true
    desc: Install fish shell
    cmds:
      - brew install --no-ask fish
  
  fzf-install:
    internal: true
    desc: Install fzf
    cmds:
      - brew install --no-ask fzf

  starship-install:
    internal: true
    desc: Install starship
    cmds:
      - brew install --no-ask starship

  delta-install:
    internal: true
    desc: Install delta
    cmds:
      - brew install --no-ask git-delta

  difftastic-install:
    internal: true
    desc: Install difftastic
    cmds:
      - brew install --no-ask difftastic

  lazygit-install:
    internal: true
    desc: Install lazygit
    cmds:
      - brew install --no-ask lazygit

  worktrunk-install:
    internal: true
    desc: Install Worktrunk
    cmds:
      - brew install --no-ask worktrunk

  ripgrep-install:
    internal: true
    desc: Install ripgrep
    cmds:
      - brew install --no-ask ripgrep

  btop-install:
    internal: true
    desc: Install btop
    cmds:
      - brew install --no-ask btop

  ctop-install:
    internal: true
    desc: Install ctop
    cmds:
      - brew install --no-ask ctop

  iperf3-install:
    internal: true
    desc: install iperf3
    cmds:
      - brew install --no-ask iperf3
  1password-cli-install:
    internal: true
    desc: install 1Password CLI
    cmds:
      - brew install --no-ask 1password-cli

  tmux-install:
    internal: true
    desc: Install tmux
    cmds:
      - brew install --no-ask tmux

  stow-install:
    internal: true
    desc: Install stow
    cmds:
      - brew install --no-ask stow

  httping-install:
    internal: true
    desc: Install httping
    cmds:
      - brew install --no-ask httping

  kubectl-install:
    internal: true
    desc: Install kubectl
    cmds:
      - brew install --no-ask kubectl

  httpstat-install:
    internal: true
    desc: Install httpstat
    cmds:
      - go install github.com/davecheney/httpstat@latest

  tree-install:
    internal: true
    desc: Install tree
    cmds:
      - brew install --no-ask tree

  fd-install:
    internal: true
    desc: Install fd
    cmds:
      - brew install --no-ask fd

  cargo-install:
    internal: true
    desc: Install Cargo
    cmds:
      - brew install --no-ask rust

  lumen-install:
    internal: true
    desc: Install lumen
    cmds:
      - brew install --no-ask jnsahaj/lumen/lumen

  neovim-install:
    internal: true
    desc: Install Neovim
    cmds:
      - brew install --no-ask neovim
  
  pi-agent-install:
    internal: true
    desc: Install pi coding agent
    cmds:
      - pnpm i -g @earendil-works/pi-coding-agent

  opencode-install:
    internal: true
    desc: Install opencode beta
    cmds:
      - pnpm add -g --allow-build=@opencode/cli @opencode/cli@beta
  
  codex-install:
    internal: true
    desc: Install codex
    cmds:
      - pnpm add -g @openai/codex
