version: "3"

tasks:
  default:
    desc: Set up Arch dependencies
    preconditions:
      - sh: "[ -f /etc/arch-release ]"
        msg: install/arch only runs on Arch Linux
    cmds:
      - task: sudo-auth
      - task: go-install
      - task: go-task-install
      - task: delta-install
      - task: difftastic-install
      - task: lazygit-install
      - task: worktrunk-install
      - task: ripgrep-install
      - task: btop-install
      - task: ctop-install
      - task: iperf3-install
      - task: 1password-cli-install
      - task: tmux-install
      - task: stow-install
      - task: httping-install
      - task: kubectl-install
      - task: httpstat-install
      - task: tree-install
      - task: fd-install
      - task: aws-cli-install
      - task: cargo-install
      - task: lumen-install
      - task: manual-setup-notes

  manual-setup-notes:
    internal: true
    desc: Print manual setup notes
    silent: true
    cmds:
      - |
        echo 'Manual setup required:'
        echo 'After fish shell is set up, open fish and run: wt config shell install'

  sudo-auth:
    internal: true
    desc: Cache sudo credentials
    cmds:
      - sudo -v

  go-install:
    internal: true
    desc: Install Go
    cmds:
      - sudo pacman -S --noconfirm go

  go-task-install:
    internal: true
    desc: Install go-task
    cmds:
      - sudo pacman -S --noconfirm go-task

  delta-install:
    internal: true
    desc: Install delta
    cmds:
      - sudo pacman -S --noconfirm git-delta

  difftastic-install:
    internal: true
    desc: Install difftastic
    cmds:
      - sudo pacman -S --noconfirm difftastic

  lazygit-install:
    internal: true
    desc: Install lazygit
    cmds:
      - sudo pacman -S --noconfirm lazygit

  worktrunk-install:
    internal: true
    desc: Install Worktrunk
    cmds:
      - sudo pacman -S --noconfirm worktrunk

  ripgrep-install:
    internal: true
    desc: Install ripgrep
    cmds:
      - sudo pacman -S --noconfirm ripgrep

  btop-install:
    internal: true
    desc: Install btop
    cmds:
      - sudo pacman -S --noconfirm btop

  ctop-install:
    internal: true
    desc: Install ctop
    cmds:
      - sudo pacman -S --noconfirm ctop

  iperf3-install:
    internal: true
    desc: Install iperf3
    cmds:
      - paru -S --noconfirm iperf3

  1password-cli-install:
    internal: true
    desc: Install 1Password CLI
    cmds:
      - paru -S 1password-cli

  tmux-install:
    internal: true
    desc: Install tmux
    cmds:
      - sudo pacman -S --noconfirm tmux

  stow-install:
    internal: true
    desc: Install stow
    cmds:
      - sudo pacman -S --noconfirm stow

  httping-install:
    internal: true
    desc: Install httping
    cmds:
      - sudo pacman -S --noconfirm httping

  kubectl-install:
    internal: true
    desc: Install kubectl
    cmds:
      - sudo pacman -S --noconfirm kubectl

  httpstat-install:
    internal: true
    desc: Install httpstat
    cmds:
      - go install github.com/davecheney/httpstat@latest

  tree-install:
    internal: true
    desc: Install tree
    cmds:
      - sudo pacman -S --noconfirm tree

  fd-install:
    internal: true
    desc: Install fd
    cmds:
      - sudo pacman -S --noconfirm fd

  aws-cli-install:
    internal: true
    desc: Install AWS cli
    cmds:
      - sudo pacman -S --noconfirm aws-cli

  cargo-install:
    internal: true
    desc: Install Cargo
    cmds:
      - sudo pacman -S --noconfirm rust

  lumen-install:
    internal: true
    desc: Install lumen
    cmds:
      - paru -S --noconfirm lumen-bin
